<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio — Single Diamonds</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&family=Julius+Sans+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js" defer></script>
  <script src="menu.js" defer></script>
  <script src="portfolio.js" defer></script>
</head>
<body>

  <!-- Cabeçalho fixo, visível em todo o site -->
  <header class="cabecalho">
    <button class="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="navegacao">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="logo">
      <img src="IMG/logo-SingleD.png" alt="Single Diamonds">
      <img src="IMG/logo-SingleD-preta.png" class="logo-preta" alt="">
    </div>

    <!-- Menu de tela cheia, aberto pelo hambúrguer (menu.js) -->
    <nav class="navegacao" id="navegacao">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="index.html#sobre-nos">Sobre Nós</a>
      <!-- A página de contato ainda não existe: trocar o href por contato.html quando ela for criada -->
      <a href="#" aria-disabled="true">Contato</a>
    </nav>
  </header>

  <!-- Portfólio: carrossel com as cinco coleções, três por vez -->
  <section class="portfolio">
    <div class="trilha">
      <article class="colecao">
        <img src="IMG/portfolio%20magnata%20SingleD.jpg" class="foto-colecao" alt="Mão masculina com anel de ouro e diamante">
        <a href="https://singlediamonds.com.br/project/anel-magnata/" class="texto-colecao">
          <h2 class="titulo-colecao">Magnata</h2>
          <p class="subtitulo-colecao">Joias masculinas</p>
        </a>
      </article>
      <article class="colecao">
        <img src="IMG/portfolio%20alta%20joalheria%20SingleD.jpg" class="foto-colecao" alt="Anel com diamante amarelo em gota cercado por diamantes">
        <a href="https://singlediamonds.com.br/project/alta-joalheria/" class="texto-colecao">
          <h2 class="titulo-colecao">Alta Joalheria</h2>
          <p class="subtitulo-colecao">Anéis Femininos</p>
        </a>
      </article>
      <article class="colecao">
        <img src="IMG/portfolio%20mimos%20animais%20SingleD.jpg" class="foto-colecao" alt="Mulher com um gato no colo">
        <a href="https://singlediamonds.com.br/project/pingentes-de-luxo-para-gatos/" class="texto-colecao">
          <h2 class="titulo-colecao">Mimos para Animais</h2>
          <p class="subtitulo-colecao">Pingentes de Luxo para pets</p>
        </a>
      </article>
      <article class="colecao">
        <img src="IMG/portfolio%20noivado%20casamento%20SingleD.jpg" class="foto-colecao" alt="Pedido de casamento em frente à Torre Eiffel">
        <a href="https://singlediamonds.com.br/project/anel-noivado-alianca-casamento/" class="texto-colecao">
          <h2 class="titulo-colecao">Noivado &amp; Casamento</h2>
          <p class="subtitulo-colecao">Alianças, Anel de Noivado</p>
        </a>
      </article>
      <article class="colecao">
        <img src="IMG/portfolio%20diamantes%20naturais%20SingleD.jpg" class="foto-colecao" alt="Mão com anel de diamante e aliança de ouro">
        <a href="https://singlediamonds.com.br/project/diamantes/" class="texto-colecao">
          <h2 class="titulo-colecao">Diamantes Naturais</h2>
          <p class="subtitulo-colecao">Eternos como sua História</p>
        </a>
      </article>
    </div>

    <div class="bolinhas">
      <button class="bolinha ativa" aria-label="Mostrar Magnata"></button>
      <button class="bolinha" aria-label="Mostrar Alta Joalheria"></button>
      <button class="bolinha" aria-label="Mostrar Mimos para Animais"></button>
      <button class="bolinha" aria-label="Mostrar Noivado &amp; Casamento"></button>
      <button class="bolinha" aria-label="Mostrar Diamantes Naturais"></button>
    </div>
  </section>

</body>
</html>
