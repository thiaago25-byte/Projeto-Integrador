# Banco PostgreSQL local de testes (as credenciais vêm do arquivo .env desta pasta)
services:
  banco:
    image: postgres:16
    container_name: singlediamonds-banco
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "127.0.0.1:${PGPORT}:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      # Roda só na primeira vez, quando o banco ainda está vazio
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro
volumes:
  dados:
